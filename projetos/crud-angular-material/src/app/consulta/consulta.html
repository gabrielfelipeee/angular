<div class="w-[95%] max-w-[1500px] m-auto">
    <mat-card class="flex flex-col gap-4 ml-auto mr-auto my-8">
        <mat-card-header>
            <mat-card-title>Consulta</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form id="formBusca" #formBusca="ngForm" (ngSubmit)="pesquisar()">
                <mat-form-field class="w-full">
                    <mat-label>Nome</mat-label>
                    <input matInput type="text" placeholder="Ex: Maria Silva" required name="nomeBusca"
                        [(ngModel)]="nomeBusca" />
                    <mat-error>Campo obrigatório</mat-error>
                </mat-form-field>

            </form>
        </mat-card-content>

        <mat-card-actions class="flex justify-end">
            <button mat-flat-button color="primary" class="mr-2" form="formBusca" type="submit">
                <mat-icon>search</mat-icon>
                Pesquisar
            </button>

        </mat-card-actions>
    </mat-card>


    <mat-card>
        <mat-card-header>
            <mat-card-title>Resultado</mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <table mat-table [dataSource]="listaClientes">

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>Id</th>
                    <td mat-cell *matCellDef="let cliente">{{cliente.id}}</td>
                </ng-container>

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let cliente">{{cliente.nome}}</td>
                </ng-container>

                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let cliente">{{cliente.email}}</td>
                </ng-container>

                <ng-container matColumnDef="cpf">
                    <th mat-header-cell *matHeaderCellDef>Cpf</th>
                    <td mat-cell *matCellDef="let cliente">{{cliente.cpf}}</td>
                </ng-container>

                <ng-container matColumnDef="data_nascimento">
                    <th mat-header-cell *matHeaderCellDef>Data de Nascimento</th>
                    <td mat-cell *matCellDef="let cliente">{{cliente.data_nascimento}}</td>
                </ng-container>

                <ng-container matColumnDef="acoes">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let cliente">

                        <button mat-button (click)="preparaEditar(cliente.id)">
                            <mat-icon fontIcon="edit"></mat-icon>
                            Editar
                        </button>

                        <button mat-button (click)="excluir(cliente.id)">
                            <mat-icon fontIcon="delete"></mat-icon>
                            Excluir
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="colunasTabelaClientes"></tr>
                <tr mat-row *matRowDef="let row; columns: colunasTabelaClientes"></tr>
            </table>

        </mat-card-content>

    </mat-card>

</div>
