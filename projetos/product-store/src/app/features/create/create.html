<div class="form_container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form_content_container">
    <mat-form-field>
      <mat-label>Título</mat-label>
      <input matInput type="text" formControlName="title" placeholder="Título do Produto" />
    </mat-form-field>

    <button mat-flat-button type="submit">Salvar</button>
  </form>
</div>
