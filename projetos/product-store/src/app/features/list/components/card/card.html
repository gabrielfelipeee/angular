<mat-card>
  <mat-card-header>
    <mat-card-title>{{ productTitle() }}</mat-card-title>
  </mat-card-header>

  <mat-card-content> </mat-card-content>

  <mat-card-actions align="end">
    <button matButton (click)="onEdit()">Editar</button>
    <button matButton (click)="onDelete()">Excluir</button>
  </mat-card-actions>
</mat-card>
